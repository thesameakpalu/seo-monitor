# Optional saved profiles. Any URL works without being listed here:
#   monitor run https://example.com
# A profile adds a short name (monitor run gtm) and per-site tuning.
# Every setting is optional except url; see README for the full list.

defaults:
  max_pages: 500        # per full run
  quick_max_pages: 40   # per quick run
  delay: 1.0            # seconds between requests to the same host

sites:
  gtdc:
    url: https://gtdc.gov.gh
    max_pages: 1000
    # Exact phrases from the charity/travel demo theme. Prefer phrases over single words:
    # "donation" or "test" also match real news ("Shared Donation Fund", "test kits").
    extra_placeholders:
      - "mytravel.test"
      - "New Section"
      - "Raise Your Hands"
      - "Charity Fundation"        # the theme's own misspelling
      - "Why Donation For Charity"
      - "Healing Hands, Open Hearts"
      - "Smart Energy Grid Utility Services"
    placeholder_whitelist: []
    key_urls: []

  gtm:
    url: https://www.gtm.com.gh
    max_pages: 1000
    extra_placeholders: ["mytravel.test"]
    thin_content_patterns: ["/location/", "/listing/", "/brief/"]
    key_urls: []

  gtip:
    url: https://www.investintourism.org
    max_pages: 500
    key_urls: []
